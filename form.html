<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Submit a product review by rating the product and its features."
    >

    <meta name="author" content="Lucas Feliciana">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <div class="form-group">
                <label for="product-name">Product Name</label>

                <select id="product-name" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="rating-fieldset">
                <legend>Overall Rating</legend>

                <div class="rating-options">
                    <label for="rating-1">
                        <span>☆</span>
                        <input
                            type="radio"
                            id="rating-1"
                            name="rating"
                            value="1"
                            required
                        >
                    </label>

                    <label for="rating-2">
                        <span>☆☆</span>
                        <input
                            type="radio"
                            id="rating-2"
                            name="rating"
                            value="2"
                            required
                        >
                    </label>

                    <label for="rating-3">
                        <span>☆☆☆</span>
                        <input
                            type="radio"
                            id="rating-3"
                            name="rating"
                            value="3"
                            required
                        >
                    </label>

                    <label for="rating-4">
                        <span>☆☆☆☆</span>
                        <input
                            type="radio"
                            id="rating-4"
                            name="rating"
                            value="4"
                            required
                        >
                    </label>

                    <label for="rating-5">
                        <span>☆☆☆☆☆</span>
                        <input
                            type="radio"
                            id="rating-5"
                            name="rating"
                            value="5"
                            required
                        >
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installation-date">
                    Date of Installation
                </label>

                <input
                    type="date"
                    id="installation-date"
                    name="installation-date"
                    required
                >
            </div>

            <fieldset class="features-fieldset">
                <legend>
                    Which features did you find useful in the product?
                    <span class="instruction">(Check all that apply)</span>
                </legend>

                <label for="durability">
                    <input
                        type="checkbox"
                        id="durability"
                        name="features"
                        value="durability"
                    >
                    Durability
                </label>

                <label for="ease-of-use">
                    <input
                        type="checkbox"
                        id="ease-of-use"
                        name="features"
                        value="ease-of-use"
                    >
                    Ease of Use
                </label>

                <label for="performance">
                    <input
                        type="checkbox"
                        id="performance"
                        name="features"
                        value="performance"
                    >
                    Performance
                </label>

                <label for="design">
                    <input
                        type="checkbox"
                        id="design"
                        name="features"
                        value="design"
                    >
                    Design
                </label>
            </fieldset>

            <div class="form-group">
                <label for="written-review">
                    Written Review
                    <span class="optional">(Optional)</span>
                </label>

                <textarea
                    id="written-review"
                    name="written-review"
                    rows="6"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="user-name">
                    Your Name
                    <span class="optional">(Optional)</span>
                </label>

                <input
                    type="text"
                    id="user-name"
                    name="user-name"
                >
            </div>

            <input
                type="submit"
                value="Post Review"
                class="submit-button"
            >
        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            | Lucas Feliciana | Illinois
        </p>

        <p id="lastModified"></p>
    </footer>
</body>
</html>
