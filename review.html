<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Confirmation page for a successfully submitted product review.">

    <meta name="author" content="Lucas Feliciana">

    <title>Review Submitted</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/review.js" defer></script>
</head>

<body>
    <header>
        <h1>Review Submitted</h1>
    </header>

    <main class="confirmation-main">
        <section class="confirmation-card">
            <h2>Thank You!</h2>

            <p>Your product review has been submitted successfully.</p>

            <p class="review-count-message">
                You have completed
                <strong>
                    <span id="review-count">0</span>
                </strong>
                product reviews.
            </p>

            <a href="form.html" class="return-link">
                Submit Another Review
            </a>
        </section>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            | Lucas Feliciana | Illinois
        </p>

        <p id="lastModified"></p>
    </footer>
</body>
</html>
